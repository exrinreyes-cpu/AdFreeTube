name: Build AdFreeTube APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập quyền thực thi cho Gradle
        run: chmod +x gradlew || true

      - name: Cài đặt Gradle wrapper nếu thiếu
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Biên dịch file APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tải file APK lên Artifacts để tải về điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: AdFreeTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
