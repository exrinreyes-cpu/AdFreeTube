name: Build AdFreeTube APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Giai nen ma nguon
        shell: python
        run: |
          import zipfile, os
          if os.path.exists("AdFreeTube.zip"):
              with zipfile.ZipFile("AdFreeTube.zip", "r") as z:
                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      if name.endswith("/"):
                          os.makedirs(name, exist_ok=True)
                      else:
                          os.makedirs(os.path.dirname(name), exist_ok=True)
                          with open(name, "wb") as f:
                              f.write(z.read(item.filename))

      - name: Thiet lap JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cai dat Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Bien dich file APK
        run: gradle assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: AdFreeTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
