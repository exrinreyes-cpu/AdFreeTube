name: Build AdFreeTube APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Tự động giải nén AdFreeTube.zip
        run: |
          if [ -f AdFreeTube.zip ]; then
            python3 -c "
          import zipfile, os
          with zipfile.ZipFile('AdFreeTube.zip', 'r') as z:
              for member in z.infolist():
                  target_path = member.filename.replace('\\', '/')
                  if target_path.endswith('/'):
                      os.makedirs(target_path, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target_path), exist_ok=True)
                      with open(target_path, 'wb') as f:
                          f.write(z.read(member))
          "
          fi

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Biên dịch file APK
        run: gradle assembleDebug --stacktrace

      - name: Tải file APK lên Artifacts để tải về điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: AdFreeTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
